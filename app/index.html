<style>
:root{--bg:#0b1120;--bg2:#124045;--card:#0d1629;--line:#1b2a44;--em:#10c98a;--em2:#34d399;--txt:#f1f5f9;--mut:#9fb0c8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;min-height:100vh;
 background-image:radial-gradient(900px 500px at 50% -120px,rgba(16,201,138,.22),transparent 70%),linear-gradient(180deg,var(--bg2) 0,var(--bg) 620px)}
a{color:var(--em2)}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:flex-end;padding:18px 0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:rgba(13,22,41,.7)}
.lang button{font:inherit;font-weight:700;font-size:.85rem;color:var(--mut);background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--em),var(--em2));color:#04231a}
.lang button:focus-visible,.cta:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hero{text-align:center;padding:18px 0 46px}
.hero img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 70px rgba(52,211,153,.45);margin-bottom:22px}
h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-.03em;line-height:1.08;margin-bottom:14px}
h1 span{color:var(--em2)}
.sub{font-size:clamp(1.05rem,2.6vw,1.3rem);color:#cbd5e1;max-width:640px;margin:0 auto 28px}
.cta{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#0b1120;text-decoration:none;font-weight:800;font-size:1.2rem;padding:16px 30px;border-radius:999px;box-shadow:0 14px 50px rgba(52,211,153,.35);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta svg{width:26px;height:26px}
.note{margin-top:14px;font-size:.92rem;color:var(--mut)}
h2{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:46px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card b{display:block;font-size:1.05rem;margin-bottom:6px}
.card p{color:var(--mut);font-size:.96rem}
.ico{width:40px;height:40px;border-radius:12px;background:#0a383f;border:1px solid #14675a;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--em2)}
.ico svg{width:22px;height:22px}
.qr{display:flex;flex-wrap:wrap;gap:26px;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;margin-bottom:46px}
.qr .box{background:#fff;border-radius:16px;padding:14px;width:190px;height:190px;flex:none}
.qr .box svg{width:100%;height:100%;display:block}
.qr p{max-width:380px;color:#cbd5e1}
.qr p small{display:block;color:var(--mut);margin-top:8px}
.know{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:22px;margin-bottom:46px}
.know h2{text-align:left;font-size:1.2rem;margin-bottom:10px;color:#fde68a}
.know ul{padding-left:20px;color:#e2e8f0}
.know li{margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;text-align:center;color:var(--mut);font-size:.92rem}
footer a{margin:0 8px}
@media (max-width:520px){.qr{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cta{transition:none}}
</style>
</head>

    <b data-fr="Chiffré sur votre téléphone" data-en="Encrypted on your phone"></b>

   <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></div>

   <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></div>
    <b data-fr="Sauvegarde chiffrée" data-en="Encrypted backup"></b>
    <p data-fr="Exportez une sauvegarde chiffrée protégée par un mot de passe de votre choix, et importez-la pour changer de téléphone." data-en="Export an encrypted backup protected by a password you choose, and import it to switch phones."></p></div>
   <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg></div>
    <b data-fr="Phrase de secours" data-en="Recovery phrase"></b>
    <p data-fr="Une phrase de 16 mots permet de rouvrir votre coffre si vous oubliez votre mot de passe maître." data-en="A 16-word phrase lets you reopen your vault if you forget your master password."></p></div>

    <b data-fr="Corbeille" data-en="Trash"></b>
    <p data-fr="Un compte supprimé par erreur peut être restauré. La corbeille reste chiffrée sur votre téléphone et n'affiche jamais vos mots de passe." data-en="An account deleted by mistake can be restored. The trash stays encrypted on your phone and never displays your passwords."></p></div>
   <div class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
