<script>
(function(){
 var titles={fr:"SafeVault – Mots de passe chiffrés sur votre téléphone",en:"SafeVault – Passwords encrypted on your phone"};
 function set(l){

 }
 document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-set');set(l);try{localStorage.setItem('sv-lang',l)}catch(e){}})});

 set(l);
